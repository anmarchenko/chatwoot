name: Backend Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  RAILS_LOG_TO_STDOUT: "false"
  COVERAGE: "true"
  LOG_LEVEL: "warn"
  RAILS_ENV: test
  NODE_ENV: test
  BUNDLE_WITHOUT: development

jobs:
  rspec:
    runs-on: ubuntu-22.04
    services:
      postgres:
        image: postgres:16
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.2.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '23.7'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Add PostgreSQL repository
        run: |
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt/ $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update -y

      - name: Install system dependencies
        run: |
          sudo apt-get install -y \
            libpq-dev \
            postgresql-client-16 \
            postgresql-common \
            build-essential \
            git \
            curl \
            libssl-dev \
            zlib1g-dev \
            libreadline-dev \
            libyaml-dev \
            openjdk-11-jdk \
            jq \
            software-properties-common \
            ca-certificates \
            imagemagick \
            libxml2-dev \
            libxslt1-dev \
            file \
            g++ \
            gcc \
            autoconf \
            gnupg2 \
            patch \
            ruby-dev \
            liblzma-dev \
            libgmp-dev \
            libncurses5-dev \
            libffi-dev \
            libgdbm6 \
            libgdbm-dev \
            libvips

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.4'
          bundler: '2.5.16'
          bundler-cache: true

      - name: Configure database and .env
        env:
          POSTGRES_SUPERUSER: postgres
          POSTGRES_SUPERPASS: postgres
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
        run: |
          set -euo pipefail
          pg_pass=$(head /dev/urandom | tr -dc A-Za-z0-9 | head -c 15)
          tmp_sql=$(mktemp)
          sed "s/REPLACE_WITH_PASSWORD/${pg_pass}/g" .circleci/setup_chatwoot.sql > "$tmp_sql"
          until PGPASSWORD=$POSTGRES_SUPERPASS psql -h $POSTGRES_HOST -U $POSTGRES_SUPERUSER -p $POSTGRES_PORT -c '\q' >/dev/null 2>&1; do
            echo "Waiting for postgres..."
            sleep 2
          done
          PGPASSWORD=$POSTGRES_SUPERPASS psql -h $POSTGRES_HOST -U $POSTGRES_SUPERUSER -p $POSTGRES_PORT -f "$tmp_sql"
          cp .env.example .env
          sed -i '/^FRONTEND_URL/d' .env
          sed -i -e '/REDIS_URL/ s|=.*|=redis://127.0.0.1:6379|' .env
          sed -i -e '/POSTGRES_HOST/ s/=.*/=127.0.0.1/' .env
          sed -i -e '/POSTGRES_USERNAME/ s/=.*/=chatwoot/' .env
          sed -i -e "/POSTGRES_PASSWORD/ s/=.*/=$pg_pass/" .env
          echo "INSTALLATION_ENV=github-actions" >> .env
          echo "POSTGRES_USERNAME=chatwoot" >> $GITHUB_ENV
          echo "POSTGRES_PASSWORD=$pg_pass" >> $GITHUB_ENV
          echo "POSTGRES_HOST=$POSTGRES_HOST" >> $GITHUB_ENV
          echo "POSTGRES_PORT=$POSTGRES_PORT" >> $GITHUB_ENV

      - name: Run database migrations
        run: bundle exec rails db:chatwoot_prepare

      - name: Run backend tests
        run: |
          mkdir -p tmp/test-results/rspec
          mkdir -p tmp/test-artifacts
          mkdir -p coverage/backend
          bundle exec rspec -I ./spec --require coverage_helper --require spec_helper \
                            --format progress \
                            --format RspecJunitFormatter \
                            --out tmp/test-results/rspec/rspec.xml

      - name: Upload RSpec results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rspec-results
          path: tmp/test-results/rspec

      - name: Upload backend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: coverage/backend

